name: Knowledge snapshot

# Rebuilds data/knowledge/ from Microsoft Learn. Weekly (or on demand) it
# proposes any change as a pull request, so every update to Microsoft's
# guidance is reviewed before Teolima uses it. On a pull request that changes
# the build itself, it runs the build and attaches the result as an artifact.

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/knowledge/**'
      - 'shared/knowledge/**'
      - '.github/workflows/knowledge.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the snapshot
        run: npm run knowledge:build
      - name: Check the snapshot
        run: npm run knowledge:verify
      - name: Summarise the change
        run: |
          {
            echo '### Knowledge snapshot'
            echo '```'
            git add -N data/knowledge
            git diff --stat -- data/knowledge || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: knowledge-snapshot
          path: data/knowledge/
          retention-days: 14

  propose:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: knowledge-snapshot
          path: data/knowledge/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate the Well-Architected checklists the app ships
        run: npm run knowledge:checklists
      - name: Open a pull request if Microsoft's guidance changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data/knowledge shared/board/waf.ts
          if git diff --cached --quiet; then
            echo 'No change in the guidance.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="knowledge/refresh-$(date -u +%Y-%m-%d)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -q -m 'chore(knowledge): refresh the guidance snapshot from Microsoft Learn'
          git push -f origin "$branch"
          gh pr create --base main --head "$branch" \
            --title 'chore(knowledge): refresh the guidance snapshot' \
            --body 'Weekly rebuild of data/knowledge/ from Microsoft Learn. Review the diff: it shows exactly which guidance changed.' \
            || echo "Pushed $branch. Open the pull request by hand, or allow GitHub Actions to create pull requests in the repository settings." >> "$GITHUB_STEP_SUMMARY"
